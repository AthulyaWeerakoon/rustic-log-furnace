##################################################
# PROCESSOR
##################################################

[[processors]]
name = "auth_logs_processor"

  ##################################################
  # SOURCES (multiple)
  ##################################################

  [[processors.sources]]
  name = "my file tail"
  protocol = "file"
  path = "/var/log/auth.log"

  [[processors.sources]]
  name = "my tcp"
  protocol = "tcp"
  host = "0.0.0.0"
  port = 9001


  ##################################################
  # PATTERNS (one or more)
  ##################################################

  [[processors.patterns]]
  name = "ssh_failed_login"
  regex = '^(?P<date>\w{3} \d{1,2}) (?P<time>\d{2}:\d{2}:\d{2}) (?P<host>[\w\-]+) (?P<process>[^ ]+): (?P<msg>.*)$'


    ##################################################
    # PARSERS (ordered)
    ##################################################

    # Parser #1
    [[processors.patterns.parsers]]
    order = 1
    type = "regex_split"
    field_in = "line"
    regex = '^(?P<date>\w{3} \d{1,2}) (?P<time>\d{2}:\d{2}:\d{2}) (?P<host>[\w\-]+) (?P<process>[^ ]+): (?P<msg>.*)$'
    keep_original = false

    # Parser #2 – time formatting
    [[processors.patterns.parsers]]
    order = 2
    type = "time_format"
    field_in = "time"
    output = "time_iso"
    format_in = "%H:%M:%S"
    format_out = "%H:%M:%S"
    keep_original = true

    # Parser #3 – uppercase
    [[processors.patterns.parsers]]
    order = 3
    type = "uppercase"
    field_in = "process"
    output = "process_uppercase"
    keep_original = false

    # Parser #4 – count substring "invalid"
    [[processors.patterns.parsers]]
    order = 4
    type = "count_pattern"
    field_in = "msg"
    regex = "invalid"
    output = "count_invalid"
    keep_original = true

    # Parser #5 – global count aggregation
    [[processors.patterns.parsers]]
    order = 5
    type = "global_count"
    field_in = "invalid_count"
    output = "total_invalid"

    # Parser #6 – global max
    [[processors.patterns.parsers]]
    order = 6
    type = "global_max"
    field_in = "invalid_count"
    output = "peak_invalid"

    # Parser #7 – global latest timestamp
    [[processors.patterns.parsers]]
    order = 7
    type = "global_latest"
    field_in = "time_iso"
    output = "last_seen"

    # Parser #8 – drop fields
    [[processors.patterns.parsers]]
    order = 8
    type = "drop_fields"
    drop = ["host"]

    # Parser #9 – format output summary
    [[processors.patterns.parsers]]
    order = 9
    type = "format_append"
    format = "At {date} {time_iso}, {process}: {msg}"
    output = "summary"
    keep_original = true


    ##################################################
    # SINKS (local + global)
    ##################################################

    [[processors.patterns.sinks]]
    name = "local_json_output"
    type = "json_file"
    path = "/tmp/auth_processed.json"
    operation = "append"

    [[processors.patterns.sinks]]
    name = "global_stats_output"
    type = "json_file"
    path = "/tmp/auth_aggregate.json"
    operation = "overwrite_with_last"
